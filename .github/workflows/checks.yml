# The completion standard from CLAUDE.md on every PR: tests, typecheck and lint. Dependabot's PRs are only safe to
# merge once this is green.
name: Checks

on:
  pull_request:
    paths: ['mobile/**', '.github/workflows/checks.yml']
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/checks.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm test -- --ci
      - run: npm run typecheck
      - run: npm run lint
