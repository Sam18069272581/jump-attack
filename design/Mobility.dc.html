<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>灵活度</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0F1115}
a{color:#C9A7FF}a:hover{color:#E0CCFF}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0F1115; color: #F2F3F5; font-family: 'Noto Sans SC', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="height: 64px; padding: 0 12px; display: flex; align-items: center; gap: 4px">
    <a href="Main.dc.html" aria-label="返回首页" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #F2F3F5">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <span style="font-size: 20px; font-weight: 700">灵活度</span>
  </div>

  <div style="flex: 1; padding: 4px 20px 0; display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; justify-content: space-between; font-size: 12px; color: #9AA1AD; padding: 0 4px 2px">
      <span>测试项目</span>
      <span style="display: flex; gap: 24px"><span>左</span><span>右</span></span>
    </div>
    <sc-for list="{{items}}" as="it" hint-placeholder-count="7">
      <button style="text-align: left; border: 0; background: #191C22; color: #F2F3F5; border-radius: 16px; padding: 12px 14px; display: flex; align-items: center; gap: 12px; font-family: inherit; cursor: pointer">
        <span style="flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0">
          <span style="font-size: 14px; font-weight: 500">{{it.name}}</span>
          <span style="font-size: 11px; color: {{it.noteColor}}">{{it.note}}</span>
        </span>
        <span style="width: 44px; text-align: right; font-family: 'Barlow Condensed', sans-serif; font-size: 20px; font-weight: 600">{{it.l}}</span>
        <span style="width: 44px; text-align: right; font-family: 'Barlow Condensed', sans-serif; font-size: 20px; font-weight: 600">{{it.r}}</span>
      </button>
    </sc-for>
    <span style="font-size: 11px; color: #9AA1AD; padding: 4px 4px 0">左右差 ≥ 10% 标橙色提醒。点击项目可拍照或用手机量角。</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const rows = [
      { name: '踝背屈 · 膝触墙', unit: 'cm', l: 11.5, r: 9.8, use: '影响落地缓冲与深蹲' },
      { name: '髋内旋', unit: '°', l: 38, r: 33, use: '变向与急停' },
      { name: '髋外旋', unit: '°', l: 46, r: 45, use: '侧向移动' },
      { name: '直腿抬高 · 腘绳肌', unit: '°', l: 82, r: 80, use: '冲刺后程' },
      { name: '托马斯测试 · 髋屈肌', unit: '°', l: 4, r: 6, use: '伸髋受限（越小越好）' },
      { name: '胸椎旋转', unit: '°', l: 48, r: 51, use: '投篮与对抗' },
      { name: '肩屈曲', unit: '°', l: 172, r: 168, use: '过顶动作' }
    ];
    return {
      items: rows.map((x) => {
        const diff = Math.abs(x.l - x.r) / Math.max(x.l, x.r);
        const flag = diff >= 0.1;
        return {
          name: x.name,
          l: x.l + x.unit,
          r: x.r + x.unit,
          note: flag ? '左右差 ' + Math.round(diff * 100) + '% · ' + x.use : x.use,
          noteColor: flag ? '#FF9F43' : '#9AA1AD'
        };
      })
    };
  }
}
</script>
</body>
</html>
